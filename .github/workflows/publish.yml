name: Publish

on:
  workflow_dispatch:
    inputs:
      semver_part:
        description: Part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      tag:
        description: Also create a git tag and GitHub release
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: bump
        env:
          TAG: ${{ inputs.tag }}
        run: |
          bun run version:bump ${{ inputs.semver_part || 'patch' }}
          VERSION="v$(bun -e "console.log(require('./package.json').version)")"
          git commit -am "chore: bump version to $VERSION"
          git push origin HEAD:main
          if [ "$TAG" = "true" ]; then
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: needs.bump.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.bump.outputs.tag }}" \
            --title "${{ needs.bump.outputs.tag }}" \
            --generate-notes
